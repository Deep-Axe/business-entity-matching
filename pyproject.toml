[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "business-entity-matching"
version = "1.0.0"
description = "Multilingual business-record matching: BM25 blocking, a CatBoost gate, cross-encoder ensemble, and exclusive owner assignment"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
  { name = "Deepam Ahuja" },
  { name = "Varanasi Naga Akhil" },
  { name = "Lakshya Jain" },
]
dynamic = ["dependencies"]

[project.urls]
Homepage = "https://github.com/Deep-Axe/business-entity-matching"
Models = "https://huggingface.co/DeeAxe/business-entity-matching-encoders"

[project.scripts]
ber = "ber.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}
